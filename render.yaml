services:
  - type: web
    name: groww-nifty-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn_config.py app:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TRADING_MODE
        value: PAPER
      - key: DASHBOARD_USERNAME
        value: admin
      - key: DASHBOARD_PASSWORD
        value: groww123
      - key: SECRET_KEY
        generateValue: true
